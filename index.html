<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Space — Moved</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #006B6B;
      --muted:  #5a6a7a;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a2332;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(90deg, #005858 0%, #006B6B 60%, #0074a0 100%);
      color: #fff;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 12px rgba(0,80,80,.3);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    header span { font-size: .78rem; opacity: .7; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle, rgba(0,107,107,.07) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(155deg, #edf5ff 0%, #e4f2ee 45%, #f0eaff 100%);
      padding: 48px 20px;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 56px;
      box-shadow: 0 4px 32px rgba(0,107,107,.12), 0 1px 4px rgba(0,0,0,.06);
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #005858 0%, #006B6B 55%, #007a9a 100%);
      padding: 16px 32px;
      border-radius: 16px;
      box-shadow: 0 6px 28px rgba(0,107,107,.28);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge h2 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.5px;
      line-height: 1;
    }
    .logo-badge-sub {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
    }

    .moved-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,107,107,.08);
      padding: 4px 14px;
      border-radius: 20px;
    }

    .card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a2332;
      line-height: 1.3;
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .btn-go {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #005858 0%, #006B6B 60%, #007a9a 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 32px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 18px rgba(0,107,107,.3);
      transition: opacity .15s, transform .1s;
      margin-top: 4px;
    }
    .btn-go:hover { opacity: .9; transform: translateY(-1px); }
    .btn-go:active { transform: translateY(0); }
    .btn-go svg { flex-shrink: 0; }

    .new-url {
      font-size: .78rem;
      color: var(--muted);
      opacity: .7;
    }
  </style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
    <circle cx="13" cy="15" r="3" fill="rgba(255,255,255,.95)"/>
    <line x1="13" y1="15" x2="13" y2="3" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <polygon points="13,0 10.5,5 15.5,5" fill="white"/>
    <line x1="13" y1="15" x2="23" y2="21" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="26,23.5 19.5,22 22,16.5" fill="rgba(255,255,255,.8)"/>
    <line x1="13" y1="15" x2="3" y2="21" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="0,23.5 4,16.5 6.5,22" fill="rgba(255,255,255,.55)"/>
  </svg>
  <h1>Vector Space</h1>
  <span>SVG &amp; 3D creation tools</span>
</header>

<main>
  <div class="card">
    <div class="logo-badge">
      <svg width="44" height="44" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <circle cx="28" cy="32" r="5" fill="rgba(255,255,255,.95)"/>
        <line x1="28" y1="32" x2="28" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,3 24,10 32,10" fill="white"/>
        <line x1="28" y1="32" x2="48" y2="43" stroke="rgba(255,255,255,.8)" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="52.5,46.5 44,44 47.5,37.5" fill="rgba(255,255,255,.8)"/>
        <line x1="28" y1="32" x2="8" y2="43" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="3.5,46.5 8.5,37.5 12,44" fill="rgba(255,255,255,.55)"/>
      </svg>
      <div>
        <h2>Vector Space</h2>
        <div class="logo-badge-sub">Creation Studio</div>
      </div>
    </div>

    <span class="moved-label">We've moved</span>

    <h3>Vector Space has a new home</h3>
    <p>The app has moved to a new address.<br>Update your bookmarks and head over.</p>

    <a class="btn-go" href="https://vectorspace-cuemath.vercel.app">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M3 9h12M10 5l5 4-5 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Go to Vector Space
    </a>

    <span class="new-url">vectorspace-cuemath.vercel.app</span>
  </div>
</main>

</body>
</html>
